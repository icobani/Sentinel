name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            os_name: Windows
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            os_name: Linux
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            os_name: Linux-ARM64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            os_name: Linux-ARMv7
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            os_name: macOS-Intel
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            os_name: macOS-AppleSilicon
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/sentinel-ui/package-lock.json

      - name: Build Angular Frontend
        run: |
          cd web/sentinel-ui
          npm ci
          npm run build

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          go build -ldflags "-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o sentinel${{ matrix.ext }} ./cmd/sentinel

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          zip sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            sentinel${{ matrix.ext }} sentinel.yaml.example

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar czf sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            sentinel${{ matrix.ext }} sentinel.yaml.example

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BASE_URL="https://github.com/icobani/Sentinel/releases/download/v${VERSION}"

          curl -sL "${BASE_URL}/sentinel-darwin-arm64.tar.gz" -o darwin-arm64.tar.gz
          curl -sL "${BASE_URL}/sentinel-darwin-amd64.tar.gz" -o darwin-amd64.tar.gz
          curl -sL "${BASE_URL}/sentinel-linux-amd64.tar.gz" -o linux-amd64.tar.gz

          echo "darwin_arm64=$(sha256sum darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum darwin-amd64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum linux-amd64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: icobani/homebrew-sentinel
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          cat > sentinel.rb << 'FORMULA'
          class Sentinel < Formula
            desc "Cross-platform file system watcher with real-time webhook notifications"
            homepage "https://github.com/icobani/Sentinel"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/icobani/Sentinel/releases/download/vVERSION_PLACEHOLDER/sentinel-darwin-arm64.tar.gz"
                sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"
              else
                url "https://github.com/icobani/Sentinel/releases/download/vVERSION_PLACEHOLDER/sentinel-darwin-amd64.tar.gz"
                sha256 "SHA_DARWIN_AMD64_PLACEHOLDER"
              end
            end

            on_linux do
              url "https://github.com/icobani/Sentinel/releases/download/vVERSION_PLACEHOLDER/sentinel-linux-amd64.tar.gz"
              sha256 "SHA_LINUX_AMD64_PLACEHOLDER"
            end

            def install
              bin.install "sentinel"
            end

            service do
              run [opt_bin/"sentinel"]
              working_dir etc
              keep_alive true
              log_path var/"log/sentinel.log"
              error_log_path var/"log/sentinel.log"
            end

            test do
              assert_match "sentinel", shell_output("#{bin}/sentinel version 2>&1", 0)
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" sentinel.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${SHA_DARWIN_ARM64}/g" sentinel.rb
          sed -i "s/SHA_DARWIN_AMD64_PLACEHOLDER/${SHA_DARWIN_AMD64}/g" sentinel.rb
          sed -i "s/SHA_LINUX_AMD64_PLACEHOLDER/${SHA_LINUX_AMD64}/g" sentinel.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sentinel.rb
          git commit -m "Update sentinel to v${{ steps.version.outputs.version }}"
          git push

  update-scoop:
    name: Update Scoop Manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download Windows release and compute SHA256
        id: sha
        run: |
          VERSION=${{ steps.version.outputs.version }}
          curl -sL "https://github.com/icobani/Sentinel/releases/download/v${VERSION}/sentinel-windows-amd64.zip" -o windows.zip
          echo "hash=$(sha256sum windows.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout Scoop bucket
        uses: actions/checkout@v4
        with:
          repository: icobani/scoop-sentinel
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HASH: ${{ steps.sha.outputs.hash }}
        run: |
          cat > sentinel.json << EOF
          {
              "version": "${VERSION}",
              "description": "Cross-platform file system watcher with real-time webhook notifications and web-based management interface",
              "homepage": "https://github.com/icobani/Sentinel",
              "license": "MIT",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/icobani/Sentinel/releases/download/v${VERSION}/sentinel-windows-amd64.zip",
                      "hash": "${HASH}"
                  }
              },
              "bin": "sentinel.exe",
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/icobani/Sentinel/releases/download/v\$version/sentinel-windows-amd64.zip"
                      }
                  }
              }
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sentinel.json
          git commit -m "Update sentinel to v${{ steps.version.outputs.version }}"
          git push
