name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            os_name: Windows
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            os_name: Linux
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            os_name: Linux-ARM64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm
            goarm: "7"
            os_name: Linux-ARMv7
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            os_name: macOS-Intel
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            os_name: macOS-AppleSilicon
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/sentinel-ui/package-lock.json

      - name: Build Angular Frontend
        run: |
          cd web/sentinel-ui
          npm ci
          npm run build

      - name: Build Go Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          go build -ldflags "-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o sentinel${{ matrix.ext }} ./cmd/sentinel

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: |
          zip sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            sentinel${{ matrix.ext }} sentinel.yaml.example

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          tar czf sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            sentinel${{ matrix.ext }} sentinel.yaml.example

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sentinel-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
